<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Urbānum [u] favicon (bracket-and-lowercase-u mark, cropped/sized
         from Josh's finalized master artwork): icon-only, no visible
         header/logo change -- see src/Header.jsx's own wordmark SVG for
         the actual site logo, untouched by this pass. apple-touch-icon.png
         is the dedicated iOS/home-screen icon, unrelated to the tab
         favicon. No manifest/PWA system exists on this site and none was
         introduced for this task -- see this pass's own report for why
         192x192/512x512 icons were skipped.

         Safari tab-favicon fix follow-up: favicon.svg previously held an
         unreferenced placeholder (a plain Courier "u", not the approved
         mark) and was deliberately left out of the <link> list below for
         that reason. favicon.svg now holds a redrawn vector copy of the
         SAME approved [u] mark the PNG/ICO assets already show (same
         concept, thin bracket strokes, restrained spacing -- only a
         touch more internal padding than the raster crop, specifically
         so Safari's own small-tab rasterization doesn't read as heavy/
         cramped/oversized). It is listed FIRST so Safari (16+), Chrome,
         and Firefox -- all of which support standard SVG favicons --
         rasterize the crisp vector for the tab instead of scaling up a
         small fixed-size PNG; the ico/png links immediately after remain
         the real fallback for any browser that ignores the SVG link. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Responsive Sanity Image Delivery: connection warm-up for the two
         hosts every page load depends on once the CMS handshake resolves.
         zxmuvik1.apicdn.sanity.io is the query API (useCdn: true's
         edge-cached read host; see src/cms/client.js, whose own comment
         already hardcodes this same project ID for the same "smallest
         possible vertical slice" reason this does). cdn.sanity.io is the
         image asset CDN every getOptimizedImageSrc/srcSet call requests
         from (see src/cms/imageUrl.js's urlFor()). preconnect opens the
         DNS, TCP, and TLS connection ahead of the first actual request
         instead of paying that cost serially at the moment it's first
         needed; dns-prefetch is the same idea as a fallback for browsers
         that don't support preconnect. crossorigin is set only on the
         query API host, matching how it's actually requested
         (@sanity/client's fetch() is a CORS request); no img element in
         this app sets crossOrigin, so cdn.sanity.io is preconnected
         without it, to match the actual non-CORS-mode connection those
         image requests use: a mismatched mode means the browser opens a
         second, separate connection anyway, wasting the hint. -->
    <link rel="preconnect" href="https://zxmuvik1.apicdn.sanity.io" crossorigin />
    <link rel="dns-prefetch" href="https://zxmuvik1.apicdn.sanity.io" />
    <link rel="preconnect" href="https://cdn.sanity.io" />
    <link rel="dns-prefetch" href="https://cdn.sanity.io" />
    <title>urbanum</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
